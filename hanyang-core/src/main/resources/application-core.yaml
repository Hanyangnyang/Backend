spring:
  servlet:
    multipart:
      max-file-size: 5MB      # 개별 파일 최대 용량 제한
      max-request-size: 5MB   # 전체 요청 최대 용량 제한

  datasource:
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?stringtype=unspecified
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}  # 기본 10개 (운영 환경변수 주입 가능)
      minimum-idle: ${HIKARI_MIN_IDLE:2}             # 최소 유휴 커넥션 2개 유지
      idle-timeout: 300000
      connection-timeout: 5000                       # 커넥션 획득 대기시간을 5초로 줄여 톰캣 쓰레드 무한 대기 방지
      max-lifetime: 1800000                          # 30분마다 안전하게 커넥션 갱신 (Supabase 세션 종료 방어)
      keepalive-time: 60000                          # 1분마다 ping 날려 Supabase 유휴 연결 끊김 방지

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms                                # Redis 커맨드 타임아웃 2초 제한 (무한 대기 방지)
      lettuce:
        shutdown-timeout: 100ms

aws:
  s3:
    endpoint: ${SUPABASE_S3_ENDPOINT}
    access-key: ${SUPABASE_S3_ACCESS_KEY}
    secret-key: ${SUPABASE_S3_SECRET_KEY}
    region: ap-northeast-2

api:
  public-data-key: ${PUBLIC_DATA_PORTAL_KEY}

  holiday:
    base-url: ${HOLIDAY_API_BASE_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
    service-key: ${HOLIDAY_API_SERVICE_KEY:${api.public-data-key}}

  subway:
    api-key: ${api.public-data-key}

  library:
    base-url:
      ${LIBRARY_API_BASE_URL:https://lib.hanyang.ac.kr}

  weather:
    base-url: ${WEATHER_API_BASE_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
    service-key: ${WEATHER_API_SERVICE_KEY:${api.public-data-key}}

  gemini:
    base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
    key: ${GEMINI_API_KEY:}
    model: ${GEMINI_API_MODEL:gemini-3.5-flash-lite}

  spotify:
    accounts-base-url: ${SPOTIFY_ACCOUNTS_BASE_URL:https://accounts.spotify.com}
    base-url: ${SPOTIFY_API_BASE_URL:https://api.spotify.com/v1}
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    market: ${SPOTIFY_MARKET:KR}
    connect-timeout: ${SPOTIFY_CONNECT_TIMEOUT:1s}
    read-timeout: ${SPOTIFY_READ_TIMEOUT:2s}
    
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  webhook:
    url: ${DISCORD_ERROR_WEBHOOK_URL:${DISCORD_WEBHOOK_URL:${SLACK_WEBHOOK_URL:}}}
