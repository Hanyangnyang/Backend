x-hanyang-api-environment: &hanyang-api-environment
  SPRING_PROFILES_ACTIVE: prod
  TZ: Asia/Seoul
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
  SPRINGDOC_API_DOCS_ENABLED: "true"
  SPRINGDOC_SWAGGER_UI_ENABLED: "true"
  MANAGEMENT_PORT: "9090"
  MANAGEMENT_ENDPOINTS_INCLUDE: health,info,metrics,prometheus

x-hanyang-api-common: &hanyang-api-common
  build:
    context: .
    dockerfile: hanyang-api/Dockerfile
  expose:
    - "8080"
    - "9090"
  env_file:
    - .env
  volumes:
    - ./.blue-green:/app/runtime:ro
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:9090/actuator/health || wget --spider -q http://localhost:9090/actuator/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s
  restart: on-failure
  stop_grace_period: 35s
  profiles:
    - blue-green

services:
  hanyang-api-blue:
    <<: *hanyang-api-common
    container_name: hanyang-api-blue
    environment:
      <<: *hanyang-api-environment
      DEPLOY_COLOR: blue

  hanyang-api-green:
    <<: *hanyang-api-common
    container_name: hanyang-api-green
    environment:
      <<: *hanyang-api-environment
      DEPLOY_COLOR: green

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: grafana-alloy
    restart: unless-stopped
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_USERNAME: ${GRAFANA_CLOUD_USERNAME}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data

  nginx:
    image: nginx:1.30-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/shared:/etc/nginx/shared:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    restart: always

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  alloy-data:
