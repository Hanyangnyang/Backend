spring:
  application:
    name: hanyang-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:classpath:/application-core.yaml
  lifecycle:
    timeout-per-shutdown-phase: 30s

admin:
  auth:
    jwt:
      secret: ${ADMIN_JWT_SECRET}
      expiration-ms: ${ADMIN_JWT_EXPIRATION:3600000}
    accounts:
      - username: ${ADMIN_ID}
        password: ${ADMIN_PASSWORD}

cors:
  allowed-origins:
    - https://hanyang.life
    - https://www.hanyang.life
    - https://admin.hanyang.life
    - https://www.admin.hanyang.life
    - http://localhost:5173
    - http://localhost:3000
    - https://*-kdjidkrs-projects.vercel.app

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
