spring:
  application:
    name: hanyang-user-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:classpath:/application-core.yaml

cors:
  allowed-origins:
    - https://hanyang.life
    - https://www.hanyang.life
    - https://admin.hanyang.life
    - https://www.admin.hanyang.life
    - http://localhost:5173
    - http://localhost:3000

server:
  port: 8080
  forward-headers-strategy: native
