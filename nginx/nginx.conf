user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloudflare가 전달한 원본 클라이언트 IP를 우선 사용하고,
    # 헤더가 없는 요청은 접속 IP를 rate limit 기준으로 사용합니다.
    map $http_cf_connecting_ip $rate_limit_key {
        ""      $binary_remote_addr;
        default $http_cf_connecting_ip;
    }

    # 클라이언트별 초당 20개 요청을 허용합니다.
    limit_req_zone $rate_limit_key zone=api_per_client:10m rate=20r/s;
    limit_req_status 429;

    # 자격증명, 저장소, 백업 파일 및 PHP/WordPress 탐색 요청을 애플리케이션 전에 차단합니다.
    map $uri $blocked_scan_path {
        default 0;
        ~*^/(?:\.env(?:[._/-]|$)|\.git(?:/|$)) 1;
        ~*\.(?:sql|zip)(?:$|/) 1;
        ~*\.php(?:$|/) 1;
        ~*^/(?:wp-admin|wp-content|wp-includes|wordpress|xmlrpc\.php)(?:/|$) 1;
        ~*/wp-includes(?:/|$) 1;
    }

    # HTTP(80) 요청 ➔ HTTPS(443)로 강제 리다이렉트
    server {
        listen 80;
        server_name api.hanyang.life admin-api.hanyang.life;

        if ($blocked_scan_path) {
            return 404;
        }

        # Let's Encrypt 인증서 갱신용 경로 열어두기
        location ~/.well-known/acme-challenge/ {
            allow all;
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 1. User API (HTTPS: 443) 설정
    server {
        listen 443 ssl;
        server_name api.hanyang.life;

        # 발급받은 Let's Encrypt 인증서 경로 지정 (init-letsencrypt 스크립트 기준)
        ssl_certificate /etc/letsencrypt/live/api.hanyang.life/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hanyang.life/privkey.pem;

        # 보안 옵션 로드
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            if ($blocked_scan_path) {
                return 404;
            }

            limit_req zone=api_per_client burst=40 nodelay;
            proxy_pass http://hanyang-user-api:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. Admin API (HTTPS: 443) 설정
    server {
        listen 443 ssl;
        server_name admin-api.hanyang.life;

        # 동일한 라이브 도메인 그룹 인증서 공유
        ssl_certificate /etc/letsencrypt/live/api.hanyang.life/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.hanyang.life/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            if ($blocked_scan_path) {
                return 404;
            }

            limit_req zone=api_per_client burst=40 nodelay;
            proxy_pass http://hanyang-admin-api:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
