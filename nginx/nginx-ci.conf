user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    include /etc/nginx/shared/security.conf;

    server {
        listen 8080;
        server_name api.hanyang.life;

        location / {
            include /etc/nginx/shared/proxy-guard.conf;
            proxy_pass http://hanyang-user-api:8080;
        }
    }

    server {
        listen 8081;
        server_name admin-api.hanyang.life;

        location / {
            include /etc/nginx/shared/proxy-guard.conf;
            proxy_pass http://hanyang-admin-api:8081;
        }
    }
}
