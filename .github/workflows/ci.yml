name: Hanyang Backend CI (PR Health Check)

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  pr-smoke-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 자바 빌드 검증
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      # 4. Actions 가상 러너 환경에 테스트용 .env 임시 주입
      - name: Inject temporary env for Runner testing
        run: |
          echo 'SUPABASE_DB_HOST=${{ secrets.SUPABASE_DB_HOST }}' > .env
          echo 'SUPABASE_DB_USER=${{ secrets.SUPABASE_DB_USER }}' >> .env
          echo 'SUPABASE_DB_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}' >> .env
          echo 'SUPABASE_S3_ENDPOINT=${{ secrets.SUPABASE_S3_ENDPOINT }}' >> .env
          echo 'SUPABASE_S3_ACCESS_KEY=${{ secrets.SUPABASE_S3_ACCESS_KEY }}' >> .env
          echo 'SUPABASE_S3_SECRET_KEY=${{ secrets.SUPABASE_S3_SECRET_KEY }}' >> .env
          echo 'ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}' >> .env
          echo 'ADMIN_ID=${{ secrets.ADMIN_ID }}' >> .env
          echo 'ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}' >> .env
          echo 'PUBLIC_DATA_PORTAL_KEY=${{ secrets.PUBLIC_DATA_PORTAL_KEY }}' >> .env
          echo 'WEATHER_API_SERVICE_KEY=${{ secrets.WEATHER_API_SERVICE_KEY }}' >> .env
          echo 'GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}' >> .env
          echo 'SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}' >> .env
          echo 'SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}' >> .env
          echo 'DISCORD_WEBHOOK_URL=' >> .env
          echo 'DISCORD_ERROR_WEBHOOK_URL=' >> .env
          echo 'FEEDBACK_WEBHOOK_URL=' >> .env
          echo 'REDIS_HOST=${{ secrets.REDIS_HOST }}' >> .env
          echo 'REDIS_PORT=${{ secrets.REDIS_PORT }}' >> .env
          echo 'REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}' >> .env
          echo 'HIKARI_MAX_POOL_SIZE=${{ secrets.HIKARI_MAX_POOL_SIZE }}' >> .env
          echo 'HIKARI_MIN_IDLE=${{ secrets.HIKARI_MIN_IDLE }}' >> .env

      # 5. 운영용 Nginx 설정을 임시 인증서로 문법 검증
      - name: Validate Nginx configuration
        run: |
          mkdir -p data/certbot/conf/live/api.hanyang.life data/certbot/www
          touch data/certbot/conf/options-ssl-nginx.conf
          openssl dhparam -out data/certbot/conf/ssl-dhparams.pem 2048
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout data/certbot/conf/live/api.hanyang.life/privkey.pem \
            -out data/certbot/conf/live/api.hanyang.life/fullchain.pem \
            -subj '/CN=localhost'
          docker compose run --rm --no-deps \
            --add-host hanyang-user-api:127.0.0.1 \
            --add-host hanyang-admin-api:127.0.0.1 \
            nginx nginx -t

      # 6. 외부 포트 공개 없이 API 컨테이너 자체 health 상태 검증
      - name: Run API containers & Smoke Health Check
        run: |
          trap 'docker compose down' EXIT
          docker compose up -d --build hanyang-user-api hanyang-admin-api

          echo "Waiting for backend services to be healthy..."
          for i in {1..24}; do
            user_status=$(docker inspect --format='{{.State.Health.Status}}' hanyang-user-api)
            admin_status=$(docker inspect --format='{{.State.Health.Status}}' hanyang-admin-api)

            if [ "$user_status" = "healthy" ] && [ "$admin_status" = "healthy" ]; then
              echo "✅ Both user-api (8080) and admin-api (8081) are HEALTHY!"
              exit 0
            fi

            if [ "$user_status" = "unhealthy" ] || [ "$admin_status" = "unhealthy" ]; then
              echo "❌ A backend service became unhealthy."
              docker compose logs hanyang-user-api hanyang-admin-api
              exit 1
            fi

            echo "Attempt $i: user-api=$user_status, admin-api=$admin_status. Retrying in 5 seconds..."
            sleep 5
          done

          echo "❌ Smoke Health Check Failed!"
          docker compose logs hanyang-user-api hanyang-admin-api
          exit 1
